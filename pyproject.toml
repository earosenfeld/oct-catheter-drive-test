[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oct-drive-test"
version = "0.1.0"
description = "Bench characterization toolkit for OCT intravascular catheter drive mechanics (NURD, rotational stability, pullback accuracy). Engineering V&V only — no clinical claims."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eric Rosenfeld" }]
keywords = [
    "OCT",
    "optical-coherence-tomography",
    "NURD",
    "catheter",
    "metrology",
    "drive-characterization",
    "verification-and-validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.scripts]
oct-drive-report = "oct_drive_test.cli:main"

[tool.setuptools]
packages = ["oct_drive_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
